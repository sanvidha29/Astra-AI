<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}{% endblock %}
    </title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/base.css') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
     <link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"> 
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">    

    {% block css %}
    {% endblock %}

</head>

<body>

<div class="app">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="logo">
            <div class="logo">

    <div class="logo-circle">
        <i class="bi bi-cpu-fill"></i>
    </div>

    <h2>ASTRA AI</h2>

    <span>Your Intelligent Assistant</span>

</div>
        </div>

        <div class="menu">

            <a href="{{ url_for('chat.chat') }}" class="menu-item">
            <i class="bi bi-chat-dots-fill"></i>
              AI Chat
            </a>

            <a href="{{ url_for('voice.voice') }}" class="menu-item">
                <i class="bi bi-mic-fill"></i>
                Talk to Astra
            </a>

            <a href="{{ url_for('settings.settings') }}" class="menu-item">
                <i class="bi bi-gear-fill"></i>
                 Settings
            </a>

        </div>

        <a href="{{ url_for('auth.logout') }}" class="logout">
            <i class="bi bi-box-arrow-right"></i>
          Logout
        </a>

    </aside>

    <!-- Main Content -->
    <main class="content {% if page == 'home' %}home-content{% endif %}">

        {% block content %}
        {% endblock %}

    </main>

</div>

{% block js %}
{% endblock %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
