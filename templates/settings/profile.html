 <!-- Profile -->

        <div id="profile" class="tab-content active">

            <h1>Profile</h1>

            <form method="POST" onsubmit="localStorage.setItem('activeTab','profile')">
              <input
                 type="hidden"
                 name="form_type"
                 value="profile">

                <div class="form-group">

                    <label>Full Name</label>

                    <input
                        type="text"
                        name="full_name"
                        value="{{ user['full_name'] }}"
                        required>

                </div>

                <div class="form-group">

                    <label>Username</label>

                    <input
                        type="text"
                        value="{{ user['username'] }}"
                        readonly>

                </div>

                <div class="form-group">

                    <label>Email</label>

                    <input
                        type="email"
                        name="email"
                        value="{{ user['email'] }}"
                        required>

                </div>

                <div class="form-group">

                    <label>Age</label>

                    <input
                        type="number"
                        name="age"
                        value="{{ user['age'] }}"
                        required>

                </div>

                <button type="submit" class="save-btn">
                    Save Changes
                </button>

            </form>

        </div>
