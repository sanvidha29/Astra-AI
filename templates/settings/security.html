<!-- Security -->

        <div id="security" class="tab-content">

    <h1>Security</h1>

    <form method="POST" onsubmit="localStorage.setItem('activeTab','security')">

        <input
            type="hidden"
            name="form_type"
            value="security">

        <div class="form-group">

            <label>Current Password</label>

            <input
                type="password"
                name="current_password"
                required>

        </div>

        <div class="form-group">

            <label>New Password</label>

            <input
                type="password"
                name="new_password"
                required>

        </div>

        <div class="form-group">

            <label>Confirm Password</label>

            <input
                type="password"
                name="confirm_password"
                required>

        </div>

        <button
            type="submit"
            class="save-btn">

            Change Password

        </button>

    </form>

</div>
