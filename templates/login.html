<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ASTRA AI - Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/login.css') }}">

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <h1>🤖 ASTRA AI</h1>

        <p>Welcome back</p>

        <form action="{{ url_for('login') }}" method="POST">

            <input
                type="text"
                name="username"
                placeholder="Username"
                required>

            <input
                type="password"
                name="password"
                placeholder="Password"
                required>

            <button type="submit">

                Login

            </button>

        </form>

    </div>

</div>

</body>

</html>
